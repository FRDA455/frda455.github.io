<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Geo Pi App</title><script src="https://sdk.minepi.com/pi-sdk.js"></script></head><body style="text-align:center; padding-top:50px; font-family:sans-serif;"><h1>Geo Pi App</h1><p id="user-info">Connecting...</p><button id="pay-btn" style="padding:15px 30px; background:#673ab7; color:#fff; border:none; border-radius:8px; font-size:16px;">Pay 0.1 Pi</button><script>const Pi = window.Pi; Pi.init({ version: "2.0", sandbox: true }); Pi.authenticate(['username', 'payments'], function(p){}).then(function(auth){ document.getElementById('user-info').innerText = "Welcome " + auth.user.username; }); document.getElementById('pay-btn').addEventListener('click', function(){ Pi.createPayment({ amount: 0.1, memo: "Checklist Step 10", metadata: { type: "test" } }, { onReadyForServerApproval: function(paymentId){ fetch('https://api.minepi.com/v2/payments/' + paymentId + '/approve', { method: 'POST', headers: { 'Authorization': 'Key 038suho3tpdwtvjwkjbv9x0ldkhriaxpcvdc7dh7ow064tnlnguvurdbqaryawbj' } }).then(() => console.log("Approved")); }, onReadyForServerCompletion: function(paymentId, txid){ fetch('https://api.minepi.com/v2/payments/' + paymentId + '/complete', { method: 'POST', headers: { 'Authorization': 'Key 038suho3tpdwtvjwkjbv9x0ldkhriaxpcvdc7dh7ow064tnlnguvurdbqaryawbj', 'Content-Type': 'application/json' }, body: JSON.stringify({ txid: txid }) }).then(() => alert("Completed!")); }, onCancel: function(p){}, onError: function(e){} }); });</script></body></html>
