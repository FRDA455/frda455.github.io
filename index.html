<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Geo Pi App</title><script src="https://sdk.minepi.com/pi-sdk.js"></script></head><body style="text-align:center; padding-top:50px;"><h1>Geo Pi App</h1><p id="user-info">Connecting...</p><button id="pay-button" style="padding:12px 24px; background:#673ab7; color:#fff; border:none; border-radius:8px;">Pay 0.1 Pi</button><script>const Pi = window.Pi; Pi.init({ version: "2.0", sandbox: true }); function onIncompletePaymentFound(payment){ console.log("Incomplete payment found", payment); } Pi.authenticate(['username', 'payments'], onIncompletePaymentFound).then(function(auth){ document.getElementById('user-info').innerText = "Welcome " + auth.user.username; }).catch(function(err){ console.error(err); }); document.getElementById('pay-button').addEventListener('click', function(){ Pi.createPayment({ amount: 0.1, memo: "Test Payment", metadata: { type: "test" } }, { onReadyForServerApproval: function(paymentId){ fetch("https://api.minepi.com/v2/payments/" + paymentId + "/approve", { method: "POST" }).catch(function(e){ console.log(e); }); }, onReadyForServerCompletion: function(paymentId, txid){ fetch("https://api.minepi.com/v2/payments/" + paymentId + "/complete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ txid: txid }) }).then(function(){ alert("Done!"); }); }, onCancel: function(paymentId){}, onError: function(error, payment){} }); });</script></body></html>
