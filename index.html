<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Geo Pi Explorer</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><style>*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}body{background:#0f111a;color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden;}header{background:#1a1c29;padding:12px;text-align:center;border-bottom:1px solid #2a2d3d;}header h1{color:#f39c12;font-size:18px;}#user-bar{font-size:11px;color:#8a8d9b;margin-top:2px;}.main-content{flex:1;position:relative;overflow-y:auto;}.tab-page{display:none;height:100%;width:100%;}.tab-page.active{display:block;}#map{height:100%;width:100%;z-index:1;}.modal{display:none;position:fixed;bottom:70px;left:5%;right:5%;background:rgba(26,28,41,0.98);border:1px solid #3a3d52;border-radius:16px;padding:15px;z-index:1000;max-height:75vh;overflow-y:auto;box-shadow:0 -5px 25px rgba(0,0,0,0.7);}.close-modal{position:absolute;top:10px;left:15px;background:#e74c3c;color:#fff;border:none;border-radius:50%;width:28px;height:28px;font-weight:bold;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}.modal img{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:8px;}.modal h3{color:#f39c12;margin-bottom:5px;font-size:15px;}.modal p{font-size:12px;color:#ccc;margin-bottom:10px;line-height:1.4;}.pay-btn{width:100%;padding:10px;background:linear-gradient(135deg,#f39c12,#8e44ad);color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:5px;}.feed-card{background:#1a1c29;border:1px solid #2a2d3d;border-radius:12px;padding:12px;margin:12px;text-align:right;}.feed-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;}.feed-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid #f39c12;}.feed-img{width:100%;height:180px;object-fit:cover;border-radius:8px;margin:8px 0;background:#000;}nav{height:60px;background:#1a1c29;border-top:1px solid #2a2d3d;display:flex;justify-content:space-around;align-items:center;}.nav-item{color:#7a7d8d;text-align:center;font-size:11px;flex:1;cursor:pointer;}.nav-item.active{color:#f39c12;font-weight:bold;}.nav-item div{font-size:18px;margin-bottom:2px;}</style></head><body><header><h1>Geo Pi Explorer 💎</h1><div id="user-bar">جاري الاتصال...</div></header><div class="main-content"><div id="tab-map" class="tab-page active"><div id="map"></div></div><div id="tab-feed" class="tab-page"><div id="feed-container"></div></div><div id="tab-scan" class="tab-page" style="padding:20px;text-align:center;"><h3 style="color:#f39c12;">فاحص الأحجار الذكي 📸</h3><p style="margin-top:20px;color:#8a8d9b;font-size:13px;">التقط صورة لأي صخرة أو نيزك للتعرف على نوعه فوراً.</p></div></div><div id="stone-modal" class="modal"><button class="close-modal" onclick="closeModal()">×</button><img id="modal-img" src="" alt="Stone"><h3 id="modal-title"></h3><p id="modal-desc"></p><div id="locked-info" style="display:none;background:#0f111a;padding:10px;border-radius:8px;margin-bottom:10px;font-size:12px;color:#2ecc71;line-height:1.5;"></div><button id="modal-pay-btn" class="pay-btn">فتح التقرير الجيولوجي الكامل (0.1 Pi)</button></div><nav><div class="nav-item active" onclick="switchTab('map')"><div>🗺️</div>الخريطة</div><div class="nav-item" onclick="switchTab('feed')"><div>📜</div>المستكشفون</div><div class="nav-item" onclick="switchTab('scan')"><div>📸</div>الفاحص</div></nav><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const Pi=window.Pi;Pi.init({version:"2.0",sandbox:true});Pi.authenticate(['username','payments'],function(p){}).then(function(auth){document.getElementById('user-bar').innerText="المستكشف: "+auth.user.username;});function switchTab(t){document.querySelectorAll('.tab-page').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');if(event)event.currentTarget.classList.add('active');closeModal();if(t==='map')setTimeout(()=>map.invalidateSize(),200);}function closeModal(){document.getElementById('stone-modal').style.display='none';}const map=L.map('map').setView([20.0,0.0],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);const locs=[{name:"زاكورة / المغرب",lat:30.3322,lng:-5.8381,img:"https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?w=500",desc:"منطقة عالمية معروفة بسقوط النيازك الصحراوية والأحجار الكريمة.",full:"🔒 <b>التقرير الجيولوجي الشامل:</b><br>• الموقع: العرق الغربي، زاكورة<br>• التركيب: نيزك شوكونديت وبازلت نقي<br>• الإحداثيات: 30.3322° N, 5.8381° W<br>• الندرة: عالية جداً في الأسواق العالمية<br>• القيمة التقديرية: $300 - $900 للجرام<br>• نصيحة ميدانية: البحث يفضل بعد العواصف الرملية مباشرة باستخدام كاشف معادن حساس."},{name:"أريزونا / أمريكا",lat:35.0272,lng:-111.0225,img:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500",desc:"فوهة نيزكية ضخمة تضم شظايا حديدية وصخور الأوبال.",full:"🔒 <b>التقرير الجيولوجي الشامل:</b><br>• الموقع: فوهة بارينجر، أريزونا<br>• التركيب: حديد نيكل (Octahedrite)<br>• الإحداثيات: 35.0272° N, 111.0225° W<br>• الندرة: تاريخية ونادرة جداً<br>• القيمة التقديرية: $500 - $1,500 للقطعة<br>• نصيحة ميدانية: الفحص بالمغناطيس القوي والبحث عن قطع متناثرة في محيط 5 كيلومترات."},{name:"طاطا / المغرب",lat:29.7497,lng:-7.9726,img:"https://images.unsplash.com/photo-1547036967-23d11aacaee0?w=500",desc:"موقع اكتشاف نيزك 'تيسينت' المريخي الشهير في الصحراء.",full:"🔒 <b>التقرير الجيولوجي الشامل:</b><br>• الموقع: إقليم طاطا، جهة سوس ماسة<br>• التركيب: نيزك مريخي أصلي (Shergottite)<br>• الإحداثيات: 29.7497° N, 7.9726° W<br>• الندرة: نادرة للغاية (قادمة من المريخ)<br>• القيمة التقديرية: تتجاوز $2,000 للجرام الواحد<br>• نصيحة ميدانية: التركيز على الوديان الجافة والسطوح السوداء القاتمة."},{name:"صحراء أتاكاما / الشيلي",lat:-23.8634,lng:-69.1328,img:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500",desc:"أجف صحراء عالمياً ومحط أنظار باحثي النيازك والسماء الصافية.",full:"🔒 <b>التقرير الجيولوجي الشامل:</b><br>• الموقع: أتاكاما الشمالية<br>• التركيب: نيازك حجرية قديمة محفوظة بفضل جفاف المناخ<br>• الإحداثيات: 23.8634° S, 69.1328° W<br>• الندرة: عالية لحفظها الطبيعي<br>• القيمة التقديرية: $400 - $1,100 للجرام<br>• نصيحة ميدانية: الاستعانة بالتصوير بالأقمار الصناعية لتحديد التضاريس الملساء."},{name:"نجران / السعودية",lat:17.4924,lng:44.1277,img:"https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500",desc:"تكوينات صخرية صحراوية قديمة تحتضن أحجار السيترين والعقيق.",full:"🔒 <b>التقرير الجيولوجي الشامل:</b><br>• الموقع: جبال وهضاب نجران<br>• التركيب: عقيق يمني أصلي وسيترين بركاني<br>• الإحداثيات: 17.4924° N, 44.1277° E<br>• الندرة: متوسطة إلى عالية للقطع النصف شفافة<br>• القيمة التقديرية: $150 - $600 للقطعة المصقولة<br>• نصيحة ميدانية: البحث في مجاري السيول القديمة وعروق الكوارتز."},{name:"جبال الأورال / روسيا",lat:60.0000,lng:59.0000,img:"https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=500",desc:"منجم الزمرد والصخور المتحولة التاريخي في سلاسل جبال الأورال.",full:"🔒 <b>التقرير الجيولوجي الشامل:</b><br>• الموقع: سلسلة جبال الأورال الوسطى<br>• التركيب: زمرد طبيعي وبريل أخضر نقي<br>• الإحداثيات: 60.0000° N, 59.0000° E<br>• الندرة: نادرة جداً ومرتفعة الطلب عالمياً<br>• القيمة التقديرية: تتجاوز $1,000 للقيراط<br>• نصيحة ميدانية: فحص الصخور المتحولة والطبقات الغنية بالسيليكات."},{name:"كيمبرلي / أستراليا",lat:-17.5000,lng:125.0000,img:"https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=500",desc:"موطن الألماس الوردي والصخور البركانية القديمة المعزولة.",full:"🔒 <b>التقرير الجيولوجي الشامل:</b><br>• الموقع: إقليم كيمبرلي، غرب أستراليا<br>• التركيب: أنابيب الكمبرلايت الحاوية للألماس<br>• الإحداثيات: 17.5000° S, 125.0000° E<br>• الندرة: من أندر أنواع الألماس في العالم<br>• القيمة التقديرية: باهظة الثمن وتباع بالمزاد العلني<br>• نصيحة ميدانية: التركيز على رواسب الأنهار القديمة والتكوينات البركانية."},{name:"ناميبيا / أفريقيا",lat:-22.5609,lng:17.0658,img:"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500",desc:"موقع نيزك 'هوبا' أكبر نيزك سليم وحديدي على وجه الأرض.",full:"🔒 <b>التقرير الجيولوجي الشامل:</b><br>• الموقع: مزرعة هوبا ويست، ناميبيا<br>• التركيب: نيزك حديدي ضخم (Ataxite)<br>• الإحداثيات: 22.5609° S, 17.0658° E<br>• الندرة: فريد من نوعه عالمياً لضخامته<br>• القيمة التقديرية: قيمة متحفية تاريخية هائلة<br>• نصيحة ميدانية: الزيارة استكشافية تعليمية ودراسة المجال المغناطيسي المحيط."}];locs.forEach(l=>{const m=L.marker([l.lat,l.lng]).addTo(map);m.on('click',()=>{document.getElementById('modal-title').innerText=l.name;document.getElementById('modal-img').src=l.img;document.getElementById('modal-desc').innerText=l.desc;document.getElementById('locked-info').innerHTML=l.full;document.getElementById('locked-info').style.display='none';document.getElementById('modal-pay-btn').style.display='block';document.getElementById('stone-modal').style.display='block';});});const explorers=[{name:"سارة المتنقلة",loc:"زاكورة - المغرب",avatar:"https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100",img:"https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?w=500",text:"بعد 4 أيام من البحث في العرق الصحراوي بزاكورة، عثرت على نيزك شوكونديت نادر بوزن 140 جرام بقشرة انصهار واضحة."},{name:"دانيال روك",loc:"صحراء أريزونا - أمريكا",avatar:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100",img:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500",text:"استكشاف فوهة بارينجر النيزكية الشهيرة. تم العثور على شظايا حديدية ممتازة وعينات أوبال بركاني."},{name:"عمر المراكشي",loc:"طاطا - المغرب",avatar:"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100",img:"https://images.unsplash.com/photo-1547036967-23d11aacaee0?w=500",text:"رحلة ناجحة في وديان طاطا القاحلة. تم توثيق موقع تساقط قديم لعينات صخرية ذات خصائص مريخية فريدة."},{name:"إيلينا سيرجييفنا",loc:"جبال الأورال - روسيا",avatar:"https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=100",img:"https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=500",text:"دراسة عروق التعدين وسفوح الأورال، واستخراج عينات زمرد خام بدرجة نقاء عالية بعد تنقيب دقيق."},{name:"سلطان القحطاني",loc:"نجران - السعودية",avatar:"https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=100",img:"https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500",text:"مسح ميداني للهضاب النارية في نجران. عثرنا على عينات عقيق طبيعي بتكوينات لونية بركانية نادرة."},{name:"كارلوس مينديز",loc:"صحراء أتاكاما - الشيلي",avatar:"https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=100",img:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500",text:"أجواء جافة تماماً ومثالية لرصد النيازك السوداء على رمال أتاكاما. نجحنا في توثيق موقعين جديدين."},{name:"ليام أودونيل",loc:"كيمبرلي - أستراليا",avatar:"https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=100",img:"https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=500",text:"تتبع مجاري الأنهار القديمة بكيمبرلي. التكوينات هنا تدل بقوة على تواجد أنابيب الكمبرلايت الحاوية للألماس."},{name:"فاطمة الزهراء",loc:"الأطلس - المغرب",avatar:"https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=100",img:"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500",text:"دراسة الصخور الرسوبية المتحولة في الأطلس الكبير. اكتشفنا طبقات جيولوجية تعود لملايين السنين."},{name:"هانز مولر",loc:"ناميبيا - أفريقيا",avatar:"https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=100",img:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500",text:"زيارة ميدانية لموقع نيزك هوبا العملاق ودراسة حقل التناثر المحيط به بحثاً عن شظايا معدنية نادرة."},{name:"جون دو",loc:"نيفادا - أمريكا",avatar:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100",img:"https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500",text:"رحلة استكشاف في صحراء نيفادا بحثاً عن صخور الفيروز الطبيعية في عروق الجبال القاحلة."}];let feedHTML="";explorers.forEach(ex=>{feedHTML+=`<div class="feed-card"><div class="feed-header"><img src="${ex.avatar}" class="feed-avatar"><div><h4 style="color:#f39c12;font-size:14px;">${ex.name} 🧭</h4><span style="font-size:10px;color:#8a8d9b;">${ex.loc}</span></div></div><p style="font-size:12px;color:#ddd;line-height:1.4;">${ex.text}</p><img src="${ex.img}" class="feed-img"><button class="pay-btn" onclick="sendTip('${ex.name}')">🎁 إرسال دعم للمستكشف (0.1 Pi)</button></div>`;});document.getElementById('feed-container').innerHTML=feedHTML;document.getElementById('modal-pay-btn').addEventListener('click',function(){makePayment("فتح التقرير الجيولوجي الكامل",0.1,()=>{document.getElementById('modal-pay-btn').style.display='none';document.getElementById('locked-info').style.display='block';});});function sendTip(name){makePayment("دعم المستكشف "+name,0.1,()=>{alert("تم إرسال الدعم بنجاح إلى "+name);});}function makePayment(memo,amt,cb){Pi.createPayment({amount:amt,memo:memo,metadata:{type:"action"}},{onReadyForServerApproval:function(id){fetch('https://api.minepi.com/v2/payments/'+id+'/approve',{method:'POST',headers:{'Authorization':'Key 038suho3tpdwtvjwkjbv9x0ldkhriaxpcvdc7dh7ow064tnlnguvurdbqaryawbj'}});},onReadyForServerCompletion:function(id,tx){fetch('https://api.minepi.com/v2/payments/'+id+'/complete',{method:'POST',headers:{'Authorization':'Key 038suho3tpdwtvjwkjbv9x0ldkhriaxpcvdc7dh7ow064tnlnguvurdbqaryawbj','Content-Type':'application/json'},body:JSON.stringify({txid:tx})}).then(()=>{cb();});},onCancel:function(p){},onError:function(e){}});}</script></body></html>
