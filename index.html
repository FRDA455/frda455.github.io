<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Geo Pi App</title><script src="https://sdk.minepi.com/pi-sdk.js"></script></head><body style="text-align:center; padding-top:50px; font-family:sans-serif;"><h1>Geo Pi App</h1><p id="user-info">Connecting to Pi Network...</p><button id="pay-btn" style="padding:15px 30px; background:#673ab7; color:#fff; border:none; border-radius:8px; font-size:16px;">Complete Step 10</button><script>const Pi = window.Pi; Pi.init({ version: "2.0", sandbox: true }); Pi.authenticate(['username', 'payments'], function(p){}).then(function(auth){ document.getElementById('user-info').innerText = "Welcome " + auth.user.username; }); document.getElementById('pay-btn').addEventListener('click', function(){ Pi.createPayment({ amount: 0.1, memo: "Developer Checklist Step 10 Verification", metadata: { type: "test_step_10" } }, { onReadyForServerApproval: function(paymentId){ console.log("Approval ready:", paymentId); }, onReadyForServerCompletion: function(paymentId, txid){ alert("Transaction Sent Successfully!"); }, onCancel: function(paymentId){}, onError: function(error){ console.error(error); } }); });</script></body></html>
