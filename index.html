<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Geo Pi App</title><script src="https://sdk.minepi.com/pi-sdk.js"></script></head><body style="text-align:center; padding-top:50px;"><h1>Geo Pi App</h1><p id="user-info">Connecting...</p><button id="auth-btn" style="padding:12px 24px; background:#673ab7; color:#fff; border:none; border-radius:8px;">Authenticate & Complete Step</button><script>const Pi = window.Pi; Pi.init({ version: "2.0", sandbox: true }); document.getElementById('auth-btn').addEventListener('click', function(){ Pi.authenticate(['username'], function(p){}).then(function(auth){ document.getElementById('user-info').innerText = "Authenticated: " + auth.user.username; alert("Authentication successful! Return to Developer Portal to verify."); }).catch(function(e){ alert("Error: " + e); }); });</script></body></html>
