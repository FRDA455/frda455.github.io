<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>Geo Pi Explorer</title> <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/> <style> *{box-sizing:border-box;margin:0;padding:0;} html,body,#map{width:100%;height:100%;background:#000;overflow:hidden;font-family:sans-serif;} .header{position:absolute;top:12px;width:100%;text-align:center;z-index:1000;pointer-events:none;} .header h1{color:#ffa500;font-size:16px;text-shadow:0 0 4px #000;} .header p{color:#ccc;font-size:11px;} .side-tools{position:absolute;top:70px;right:12px;z-index:1000;display:flex;flex-direction:column;gap:10px;} .tool-btn{width:40px;height:40px;background:rgba(20,20,20,0.85);border:1px solid #444;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.5);} .status-tag{position:absolute;bottom:65px;left:12px;z-index:1000;background:rgba(20,20,20,0.85);border:1px solid #333;color:#aaa;padding:6px 12px;border-radius:8px;font-size:11px;} .nav-bar{position:absolute;bottom:0;width:100%;height:50px;background:#111;display:flex;justify-content:space-around;align-items:center;z-index:1000;border-top:1px solid #222;} .nav-item{color:#777;font-size:13px;text-decoration:none;cursor:pointer;} .nav-item.active{color:#ffa500;font-weight:bold;} </style> </head> <body> <div class="header"> <h1>Geo Pi Explorer 🌍 [Ultra-HD]</h1> <p>منظومة الأقمار الصناعية عالية الوضوح</p> </div> <div class="side-tools"> <div class="tool-btn">📍</div> <div class="tool-btn">📏</div> <div class="tool-btn">🗑️</div> <div class="tool-btn" style="font-size:12px;font-weight:bold;color:#ffa500;">3D</div> <div class="tool-btn">🧭</div> </div> <div class="status-tag">حالة الخريطة: فائقة الوضوح (Ultra-HD)</div> <div id="map"></div> <div class="nav-bar"> <span class="nav-item">الفاحص 📷</span> <span class="nav-item">المستكشفون 📜</span> <span class="nav-item active">الخريطة 🗺️</span> </div> <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script> <script> window.onload=()=>{const m=L.map('map',{zoomControl:false}).setView([20,0],3);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:18}).addTo(m);setTimeout(()=>m.invalidateSize(),300);}; </script> </body> </html>
