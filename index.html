<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Geo Pi Explorer</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><style>*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}body{background:#0f111a;color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden;}header{background:#1a1c29;padding:10px;text-align:center;border-bottom:1px solid #2a2d3d;}header h1{color:#f39c12;font-size:16px;}#user-bar{font-size:11px;color:#8a8d9b;margin-top:2px;}.main-content{flex:1;position:relative;overflow-y:auto;}.tab-page{display:none;height:100%;width:100%;}.tab-page.active{display:block;}#map{height:100%;width:100%;z-index:1;}.modal{display:none;position:fixed;bottom:65px;left:5%;right:5%;background:rgba(26,28,41,0.98);border:1px solid #3a3d52;border-radius:14px;padding:12px;z-index:1000;max-height:75vh;overflow-y:auto;}.close-modal{position:absolute;top:8px;left:12px;background:#e74c3c;color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-weight:bold;cursor:pointer;}.modal img{width:100%;height:140px;object-fit:cover;border-radius:10px;margin-bottom:6px;}.pay-btn{width:100%;padding:9px;background:linear-gradient(135deg,#f39c12,#8e44ad);color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:4px;}.feed-card{background:#1a1c29;border:1px solid #2a2d3d;border-radius:10px;padding:10px;margin:10px;}.feed-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;}.feed-img{width:100%;height:160px;object-fit:cover;border-radius:6px;margin:6px 0;}.scan-container{padding:15px;text-align:center;}.upload-box{border:2px dashed #f39c12;border-radius:10px;padding:15px;margin-top:10px;background:#1a1c29;cursor:pointer;}.preview-img{max-width:100%;height:180px;object-fit:cover;border-radius:6px;margin-top:10px;display:none;}nav{height:55px;background:#1a1c29;border-top:1px solid #2a2d3d;display:flex;justify-content:space-around;align-items:center;}.nav-item{color:#7a7d8d;text-align:center;font-size:11px;flex:1;cursor:pointer;}.nav-item.active{color:#f39c12;font-weight:bold;}</style></head><body><header><h1>Geo Pi Explorer 💎</h1><div id="user-bar">جاهز</div></header><div class="main-content"><div id="tab-map" class="tab-page active"><div id="map"></div></div><div id="tab-feed" class="tab-page"><div id="feed-container"></div></div><div id="tab-scan" class="tab-page"><div class="scan-container"><h3 style="color:#f39c12;">فاحص النيازك 📸</h3><div class="upload-box" onclick="document.getElementById('fileInput').click()"><span>اضغط لالتقاط أو رفع صورة</span><input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;" onchange="handleImageUpload(event)"></div><img id="imagePreview" class="preview-img"><div id="scanResult" style="display:none;background:#1a1c29;padding:10px;margin-top:10px;border-radius:8px;font-size:11px;"></div></div></div></div><div id="stone-modal" class="modal"><button class="close-modal" onclick="closeModal()">×</button><img id="modal-img"><h3 id="modal-title" style="color:#f39c12;font-size:14px;"></h3><p id="modal-desc" style="font-size:11px;color:#ccc;"></p><button id="modal-pay-btn" class="pay-btn">فتح التقرير (0.1 Pi)</button></div><nav><div class="nav-item active" onclick="switchTab('map')">🗺️ الخريطة</div><div class="nav-item" onclick="switchTab('feed')">📜 المستكشفون</div><div class="nav-item" onclick="switchTab('scan')">📸 الفاحص</div></nav><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>try{const Pi=window.Pi;Pi.init({version:"2.0",sandbox:true});}catch(e){}function switchTab(t){document.querySelectorAll('.tab-page').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');if(event)event.currentTarget.classList.add('active');if(t==='map')setTimeout(()=>map.invalidateSize(),100);}function closeModal(){document.getElementById('stone-modal').style.display='none';}const map=L.map('map',{zoomControl:false}).setView([30.3322,-5.8381],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);const locs=[{name:"زاكورة / المغرب",lat:30.3322,lng:-5.8381,img:"https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?w=300",desc:"منطقة معروفة بالنيازك الصحراوية."},{name:"أريزونا / أمريكا",lat:35.0272,lng:-111.0225,img:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=300",desc:"فوهة نيزكية ضخمة."}];locs.forEach(l=>{L.marker([l.lat,l.lng]).addTo(map).on('click',()=>{document.getElementById('modal-title').innerText=l.name;document.getElementById('modal-img').src=l.img;document.getElementById('modal-desc').innerText=l.desc;document.getElementById('stone-modal').style.display='block';});});function handleImageUpload(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(evt){document.getElementById('imagePreview').src=evt.target.result;document.getElementById('imagePreview').style.display='block';document.getElementById('scanResult').innerHTML="<b>النتيجة:</b> عينة صخرية محتملة (نيزك حجري)";document.getElementById('scanResult').style.display='block';};r.readAsDataURL(f);}</script></body></html>
