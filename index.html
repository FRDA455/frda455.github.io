<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Geo Pi Explorer</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><style>*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}body{background:#0f111a;color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden;}header{background:#1a1c29;padding:10px;text-align:center;border-bottom:1px solid #2a2d3d;}header h1{color:#f39c12;font-size:16px;}#user-bar{font-size:11px;color:#8a8d9b;margin-top:2px;}.main-content{flex:1;position:relative;overflow-y:auto;}.tab-page{display:none;height:100%;width:100%;}.tab-page.active{display:block;}#map{height:100%;width:100%;z-index:1;}.modal{display:none;position:fixed;bottom:65px;left:5%;right:5%;background:rgba(26,28,41,0.98);border:1px solid #3a3d52;border-radius:14px;padding:12px;z-index:1000;max-height:75vh;overflow-y:auto;}.close-modal{position:absolute;top:8px;left:12px;background:#e74c3c;color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-weight:bold;cursor:pointer;}.modal img{width:100%;height:140px;object-fit:cover;border-radius:10px;margin-bottom:6px;}.pay-btn{width:100%;padding:9px;background:linear-gradient(135deg,#f39c12,#8e44ad);color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:4px;}.feed-card{background:#1a1c29;border:1px solid #2a2d3d;border-radius:10px;padding:12px;margin:10px;}.feed-header{display:flex;align-items:center;margin-bottom:8px;}.feed-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;margin-left:10px;}.feed-img{width:100%;height:180px;object-fit:cover;border-radius:8px;margin:8px 0;}.scan-container{padding:15px;text-align:center;}.upload-box{border:2px dashed #f39c12;border-radius:10px;padding:15px;margin-top:10px;background:#1a1c29;cursor:pointer;}.preview-img{max-width:100%;height:180px;object-fit:cover;border-radius:6px;margin-top:10px;display:none;}nav{height:55px;background:#1a1c29;border-top:1px solid #2a2d3d;display:flex;justify-content:space-around;align-items:center;}.nav-item{color:#7a7d8d;text-align:center;font-size:11px;flex:1;cursor:pointer;}.nav-item.active{color:#f39c12;font-weight:bold;}</style></head><body><header><h1>Geo Pi Explorer 💎</h1><div id="user-bar">متصل بـ Pi Network</div></header><div class="main-content"><div id="tab-map" class="tab-page active"><div id="map"></div></div><div id="tab-feed" class="tab-page"><div id="feed-container" style="padding-bottom:20px;"></div></div><div id="tab-scan" class="tab-page"><div class="scan-container"><h3 style="color:#f39c12;">فاحص النيازك 📸</h3><div class="upload-box" onclick="document.getElementById('fileInput').click()"><span>اضغط لالتقاط أو رفع صورة الصخرة</span><input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;" onchange="handleImageUpload(event)"></div><img id="imagePreview" class="preview-img"><div id="scanResult" style="display:none;background:#1a1c29;padding:10px;margin-top:10px;border-radius:8px;font-size:11px;"></div></div></div></div><div id="stone-modal" class="modal"><button class="close-modal" onclick="closeModal()">×</button><img id="modal-img"><h3 id="modal-title" style="color:#f39c12;font-size:14px;"></h3><p id="modal-desc" style="font-size:11px;color:#ccc;margin-top:5px;"></p><button id="modal-pay-btn" class="pay-btn">فتح الإحداثيات الكاملة (0.1 Pi)</button></div><nav><div class="nav-item active" onclick="switchTab('map')">🗺️ الخريطة</div><div class="nav-item" onclick="switchTab('feed')">📜 المستكشفون</div><div class="nav-item" onclick="switchTab('scan')">📸 الفاحص</div></nav><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>try{const Pi=window.Pi;Pi.init({version:"2.0",sandbox:true});}catch(e){}function switchTab(t){document.querySelectorAll('.tab-page').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');if(event)event.currentTarget.classList.add('active');if(t==='map')setTimeout(()=>map.invalidateSize(),100);if(t==='feed')loadFeed();}function closeModal(){document.getElementById('stone-modal').style.display='none';}const map=L.map('map',{zoomControl:false}).setView([28.5,-3.0],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);const locs=[{name:"زاكورة / المغرب",lat:30.3322,lng:-5.8381,img:"https://images.unsplash.com/photo-1547234935-80c7145ec969?w=300",desc:"منطقة غنية بالنيازك الحديدية والحجرية الصحراوية."},{name:"أريزونا / أمريكا",lat:35.0272,lng:-111.0225,img:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=300",desc:"فوهة بارينجر النيزكية الضخمة."},{name:"سيبيريا / روسيا",lat:60.9100,lng:101.8900,img:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300",desc:"موقع حدث تونغوسكا النيزكي الشهير."},{name:"صحراء تنري / النيجر",lat:19.2667,lng:10.5167,img:"https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?w=300",desc:"منطقة اكتشاف نيزك تاتويست الشهير."},{name:"أتاكاما / تشيلي",lat:-23.8634,lng:-69.1328,img:"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=300",desc:"تربة مثالية لحفظ النيازك لآلاف السنين."}];locs.forEach(l=>{L.marker([l.lat,l.lng]).addTo(map).on('click',()=>{document.getElementById('modal-title').innerText=l.name;document.getElementById('modal-img').src=l.img;document.getElementById('modal-desc').innerText=l.desc;document.getElementById('stone-modal').style.display='block';});});function loadFeed(){const container=document.getElementById('feed-container');if(container.innerHTML.trim()!=="")return;const posts=[{user:"أحمد الصحراوي",avatar:"https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100",img:"https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=300",text:"تم عثور على عينة نيزك حجري فريدة ذات قشرة انصهار واضحة في عمق صحراء زاكورة."},{user:"مارك ويلسون",avatar:"https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100",img:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300",text:"استكشاف ميداني ناجح قرب مواقع الارتطام القديمة، تم فحص صخور غنية بالمعادن النادرة."},{user:"يوسف الإدريسي",avatar:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100",img:"https://images.unsplash.com/photo-1547234935-80c7145ec969?w=300",text:"استخدام جهاز كشف المعادن قادنا لاكتشاف حجر نيزكي معدني نادر يزن حوالي 850 غرام."},{user:"إيلينا رومانوف",avatar:"https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100",img:"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=300",text:"رحلة بحث استكشافية في التضاريس الوعرة، العينات المبدئية تبدي خصائص مغناطيسية قوية جداً."}];let html="";posts.forEach(p=>{html+=`<div class="feed-card"><div class="feed-header"><img src="${p.avatar}" class="feed-avatar"><b>${p.user}</b></div><p style="font-size:12px;color:#ddd;">${p.text}</p><img src="${p.img}" class="feed-img"></div>`;});container.innerHTML=html;}function handleImageUpload(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(evt){document.getElementById('imagePreview').src=evt.target.result;document.getElementById('imagePreview').style.display='block';document.getElementById('scanResult').innerHTML="<b>تحليل الذكاء الاصطناعي:</b> عينة صخرية تحتوي على قشرة انصهار ونسبة حديد عالية (محتمل جداً أن تكون نيزك).";document.getElementById('scanResult').style.display='block';};r.readAsDataURL(f);}</script></body></html>
