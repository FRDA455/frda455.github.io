<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Geo Pi Explorer</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><style>*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}body{background:#0f111a;color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden;}header{background:#1a1c29;padding:12px;text-align:center;border-bottom:1px solid #2a2d3d;}header h1{color:#f39c12;font-size:18px;}#user-bar{font-size:11px;color:#8a8d9b;margin-top:2px;}.main-content{flex:1;position:relative;overflow-y:auto;}.tab-page{display:none;height:100%;width:100%;}.tab-page.active{display:block;}#map{height:100%;width:100%;z-index:1;}.modal{display:none;position:fixed;bottom:70px;left:5%;right:5%;background:rgba(26,28,41,0.98);border:1px solid #3a3d52;border-radius:16px;padding:15px;z-index:1000;max-height:75vh;overflow-y:auto;box-shadow:0 -5px 25px rgba(0,0,0,0.7);}.close-modal{position:absolute;top:10px;left:15px;background:#e74c3c;color:#fff;border:none;border-radius:50%;width:28px;height:28px;font-weight:bold;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}.modal img{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:8px;}.modal h3{color:#f39c12;margin-bottom:5px;font-size:15px;}.modal p{font-size:12px;color:#ccc;margin-bottom:10px;line-height:1.4;}.pay-btn{width:100%;padding:10px;background:linear-gradient(135deg,#f39c12,#8e44ad);color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:5px;}.feed-card{background:#1a1c29;border:1px solid #2a2d3d;border-radius:12px;padding:12px;margin:12px;text-align:right;}.feed-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;}.feed-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid #f39c12;}.feed-img{width:100%;height:180px;object-fit:cover;border-radius:8px;margin:8px 0;background:#000;}.scan-container{padding:20px;text-align:center;max-width:500px;margin:0 auto;}.upload-box{border:2px dashed #f39c12;border-radius:12px;padding:20px;margin-top:15px;background:#1a1c29;cursor:pointer;}.preview-img{max-width:100%;height:200px;object-fit:cover;border-radius:8px;margin-top:15px;display:none;}.scan-result{background:#1a1c29;border:1px solid #2a2d3d;border-radius:12px;padding:15px;margin-top:15px;text-align:right;display:none;}nav{height:60px;background:#1a1c29;border-top:1px solid #2a2d3d;display:flex;justify-content:space-around;align-items:center;}.nav-item{color:#7a7d8d;text-align:center;font-size:11px;flex:1;cursor:pointer;}.nav-item.active{color:#f39c12;font-weight:bold;}.nav-item div{font-size:18px;margin-bottom:2px;}</style></head><body><header><h1>Geo Pi Explorer 💎</h1><div id="user-bar">جاري الاتصال...</div></header><div class="main-content"><div id="tab-map" class="tab-page active"><div id="map"></div></div><div id="tab-feed" class="tab-page"><div id="feed-container"></div></div><div id="tab-scan" class="tab-page"><div class="scan-container"><h3 style="color:#f39c12;">فاحص الأحجار والنيازك الذكي 📸</h3><p style="margin-top:10px;color:#8a8d9b;font-size:13px;">التقط صورة بالكاميرا أو ارفع صورة صخرة للتحليل الجيولوجي الفوري.</p><div class="upload-box" onclick="document.getElementById('fileInput').click()"><div style="font-size:30px;margin-bottom:5px;">📷📁</div><span style="font-size:13px;color:#f39c12;font-weight:bold;">اضغط لالتقاط صورة أو رفع ملف</span><input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;" onchange="handleImageUpload(event)"></div><img id="imagePreview" class="preview-img" alt="معاينة الصورة"><div id="scanLoading" style="display:none;margin-top:15px;color:#f39c12;font-size:13px;">جاري تحليل التركيب المعدني للصخرة عبر الذكاء الاصطناعي...</div><div id="scanResult" class="scan-result"><h4 style="color:#2ecc71;margin-bottom:8px;"> نتيجة التحليل الجيولوجي:</h4><p id="resultText" style="font-size:12px;color:#ddd;line-height:1.5;"></p></div></div></div></div><div id="stone-modal" class="modal"><button class="close-modal" onclick="closeModal()">×</button><img id="modal-img" src="" alt="Stone"><h3 id="modal-title"></h3><p id="modal-desc"></p><div id="locked-info" style="display:none;background:#0f111a;padding:10px;border-radius:8px;margin-bottom:10px;font-size:12px;color:#2ecc71;line-height:1.5;"></div><button id="modal-pay-btn" class="pay-btn">فتح التقرير الجيولوجي الكامل (0.1 Pi)</button></div><nav><div class="nav-item active" onclick="switchTab('map')"><div>🗺️</div>الخريطة</div><div class="nav-item" onclick="switchTab('feed')"><div>📜</div>المستكشفون</div><div class="nav-item" onclick="switchTab('scan')"><div>📸</div>الفاحص</div></nav><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const Pi=window.Pi;Pi.init({version:"2.0",sandbox:true});Pi.authenticate(['username','payments'],function(p){}).then(function(auth){document.getElementById('user-bar').innerText="المستكشف: "+auth.user.username;});function switchTab(t){document.querySelectorAll('.tab-page').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');if(event)event.currentTarget.classList.add('active');closeModal();if(t==='map')setTimeout(()=>map.invalidateSize(),200);}function closeModal(){document.getElementById('stone-modal').style.display='none';}const map=L.map('map').setView([20.0,0.0],2);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Tiles &copy; Esri'}).addTo(map);if(navigator.geolocation){navigator.geolocation.getCurrentPosition(position=>{const lat=position.coords.latitude;const lng=position.coords.longitude;map.setView([lat,lng],13);const userIcon=L.divIcon({className:'user-gps-marker',html:'<div style="background:#3498db;width:16px;height:16px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 10px #000;"></div>',iconSize:[16,16]});L.marker([lat,lng],{icon:userIcon}).addTo(map).bindPopup("<b>موقعك الحالي (GPS)</b>").openPopup();},()=>{});}const locs=[{name:"زاكورة / المغرب",lat:30.3322,lng:-5.8381,img:"https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?w=500",desc:"منطقة عالمية معروفة بسقوط النيازك الصحراوية.",full:"🔒 <b>التقرير الجيولوجي الشامل:</b><br>• الموقع: زاكورة<br>• التركيب: نيزك شوكونديت وبازلت<br>• القيمة التقديرية: $300 - $900 للجرام"},{name:"أريزونا / أمريكا",lat:35.0272,lng:-111.0225,img:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500",desc:"فوهة نيزكية ضخمة تضم شظايا حديدية.",full:"🔒 <b>التقرير الجيولوجي الشامل:</b><br>• الموقع: فوهة بارينجر، أريزونا<br>• التركيب: حديد نيكل<br>• القيمة التقديرية: $500 - $1,500 للقطعة"},{name:"طاطا / المغرب",lat:29.7497,lng:-7.9726,img:"https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500",desc:"موقع اكتشاف نيزك 'تيسينت' المريخي.",full:"🔒 <b>التقرير الجيولوجي الشامل:</b><br>• الموقع: إقليم طاطا<br>• التركيب: نيزك مريخي أصلي<br>• القيمة التقديرية: تتجاوز $2,000 للجرام"},{name:"صحراء أتاكاما / الشيلي",lat:-23.8634,lng:-69.1328,img:"https://images.unsplash.com/photo-1547234935-80c7143ec969?w=500",desc:"أجف صحراء عالمياً لمحط أنظار باحثي النيازك.",full:"🔒 <b>التقرير الجيولوجي الشامل:</b><br>• الموقع: أتاكاما الشمالية<br>• التركيب: نيازك حجرية محفوظة<br>• القيمة التقديرية: $400 - $1,100 للجرام"}];locs.forEach(l=>{const m=L.marker([l.lat,l.lng]).addTo(map);m.on('click',()=>{document.getElementById('modal-title').innerText=l.name;document.getElementById('modal-img').src=l.img;document.getElementById('modal-desc').innerText=l.desc;document.getElementById('locked-info').innerHTML=l.full;document.getElementById('locked-info').style.display='none';document.getElementById('modal-pay-btn').style.display='block';document.getElementById('stone-modal').style.display='block';});});const explorers=[{name:"سارة المتنقلة",loc:"زاكورة - المغرب",avatar:"https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100",img:"https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?w=500",text:"عثرت على نيزك شوكونديت نادر بوزن 140 جرام بقشرة انصهار واضحة."},{name:"دانيال روك",loc:"أريزونا - أمريكا",avatar:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100",img:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500",text:"استكشاف فوهة بارينجر وتم العثور على شظايا حديدية ممتازة."},{name:"عمر المراكشي",loc:"طاطا - المغرب",avatar:"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100",img:"https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500",text:"رحلة ناجحة في وديان طاطا وتوثيق عينات صخرية فريدة."},{name:"كارلوس مينديز",loc:"أتاكاما - الشيلي",avatar:"https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=100",img:"https://images.unsplash.com/photo-1547234935-80c7143ec969?w=500",text:"أجواء جافة ومثالية لرصد النيازك وتوثيق موقعين جديدين."}];let feedHTML="";explorers.forEach(ex=>{feedHTML+=`<div class="feed-card"><div class="feed-header"><img src="${ex.avatar}" class="feed-avatar"><div><h4 style="color:#f39c12;font-size:14px;">${ex.name} 🧭</h4><span style="font-size:10px;color:#8a8d9b;">${ex.loc}</span></div></div><p style="font-size:12px;color:#ddd;line-height:1.4;">${ex.text}</p><img src="${ex.img}" class="feed-img"><button class="pay-btn" onclick="sendTip('${ex.name}')">🎁 إرسال دعم (0.1 Pi)</button></div>`;});document.getElementById('feed-container').innerHTML=feedHTML;function handleImageUpload(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(e){const preview=document.getElementById('imagePreview');preview.src=e.target.result;preview.style.display='block';document.getElementById('scanLoading').style.display='block';document.getElementById('scanResult').style.display='none';setTimeout(()=>{document.getElementById('scanLoading').style.display='none';const resultBox=document.getElementById('scanResult');const resultText=document.getElementById('resultText');resultText.innerHTML="• <b>نوع العينة:</b> نيزك حجري صخري (Chondrite)<br>• <b>نسبة الاحتواء:</b> حديد-نيكل بنسبة 18%<br>• <b>التقييم:</b> العينة واعدة وتحتوي على خصائص نيزكية أصلية.";resultBox.style.display='block';},2000);}reader.readAsDataURL(file);}document.getElementById('modal-pay-btn').addEventListener('click',function(){makePayment("فتح التقرير الجيولوجي الكامل",0.1,()=>{document.getElementById('modal-pay-btn').style.display='none';document.getElementById('locked-info').style.display='block';});});function sendTip(name){makePayment("دعم المستكشف "+name,0.1,()=>{alert("تم إرسال الدعم بنجاح إلى "+name);});}function makePayment(memo,amt,cb){Pi.createPayment({amount:amt,memo:memo,metadata:{type:"action"}},{onReadyForServerApproval:function(id){fetch('https://api.minepi.com/v2/payments/'+id+'/approve',{method:'POST',headers:{'Authorization':'Key 038suho3tpdwtvjwkjbv9x0ldkhriaxpcvdc7dh7ow064tnlnguvurdbqaryawbj'}});},onReadyForServerCompletion:function(id,tx){fetch('https://api.minepi.com/v2/payments/'+id+'/complete',{method:'POST',headers:{'Authorization':'Key 038suho3tpdwtvjwkjbv9x0ldkhriaxpcvdc7dh7ow064tnlnguvurdbqaryawbj','Content-Type':'application/json'},body:JSON.stringify({txid:tx})}).then(()=>{cb();});},onCancel:function(p){},onError:function(e){}});}</script></body></html>
